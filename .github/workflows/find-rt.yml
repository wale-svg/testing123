name: find-rt
on: [push, workflow_dispatch]

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wale-svg/nxnative-wale
          ref: no-bc
          path: nx

      - name: Compressed render target code
        run: |
          cd nx
          F=dm/gfx/nvn/nvn_mtl.m
          L=$(grep -n "render target is a compressed-format texture" $F | head -n1 | cut -d: -f1)
          echo "=== around the RED line ($L) ==="
          [ -n "$L" ] && sed -n "$((L-60)),$((L+25))p" $F
          L2=$(grep -n "^static int bc_astc" $F | head -n1 | cut -d: -f1)
          echo "=== bc_astc ($L2) ==="
          [ -n "$L2" ] && sed -n "${L2},$((L2+30))p" $F
          echo "=== docs ==="
          grep -n -A12 -i "compressed texture as a render target" docs/reference/*.md | head -60
