name: NxNative - Generic IPA Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose the target device and texture support path"
        required: true
        type: choice
        default: "iPhone 15 or older (BC fallback)"
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      profile_id:
        description: "Optional nxnative profile ID override (leave blank for automatic detection)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    # Preview runner image that ships Xcode 27 (needed for the newer MetalFX SDK).
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      # Older iPhones (A16 and below): fork that avoids BC textures (ASTC path)
      - name: Checkout no-BC (ASTC) fork
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        uses: actions/checkout@v4
        with:
          repository: wale-svg/nxnative-wale
          ref: no-bc

      - name: Checkout standard nxnative version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main

      - name: Record checked-out commit
        shell: bash
        run: |
          echo "Building from commit: $(git rev-parse HEAD)"

      - name: Free up disk space on the runner
        shell: bash
        run: |
          echo "Before cleanup:"
          df -h /

          # Old Xcode versions we don't use (the Xcode 27 one stays).
          sudo rm -rf /Applications/Xcode_26*.app /Applications/Xcode_16*.app /Applications/Xcode_15*.app 2>/dev/null || true

          # Simulators and Android tooling (not needed for an unsigned device build).
          xcrun simctl delete all 2>/dev/null || true
          xcrun simctl runtime delete all 2>/dev/null || true
          rm -rf "$HOME/Library/Android" 2>/dev/null || true

          echo "After cleanup:"
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross unar glslang
          python -m pip install --upgrade pip
          python -m pip install \
            lz4 "capstone>=5,<6" fonttools zbic backports.zstd gdown

      # Cached game files (base game / update / DLC). Change "v1" to "v2" in
      # both cache steps' key to force a fresh download (e.g. new update).
      - name: Restore cached game files
        id: game_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/game-cache
          key: game-files-v1

      - name: Download game files and keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          download_file() {
            local url="$1"
            local output="$2"
            local file_id

            if [[ -z "${url:-}" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi

            file_id="$(python - "$url" <<'PY'
          import re
          import sys
          from urllib.parse import urlparse, parse_qs

          url = sys.argv[1].strip()
          parsed = urlparse(url)
          query = parse_qs(parsed.query)
          file_id = None

          if parsed.netloc.lower() in (
              "drive.google.com",
              "www.drive.google.com",
          ):
              match = re.search(r"/file/d/([^/]+)", parsed.path)
              if match:
                  file_id = match.group(1)
              elif query.get("id"):
                  file_id = query["id"][0]

          if not file_id and re.fullmatch(
              r"[-A-Za-z0-9_]{20,}", url
          ):
              file_id = url

          if not file_id:
              raise SystemExit(
                  "Could not extract a Google Drive file ID."
              )

          print(file_id)
          PY
          )"

            echo "Downloading $(basename "$output")..."
            gdown "$file_id" -O "$output"

            if [[ ! -s "$output" ]]; then
              echo "::error::Downloaded file is empty."
              exit 1
            fi

            file "$output"
          }

          CACHE="$RUNNER_TEMP/game-cache"
          mkdir -p "$CACHE"

          # Uses the cached copy if there is one; otherwise downloads it and
          # stores it in the cache folder. Hard links avoid duplicating
          # multi-GB files on the runner's limited disk.
          fetch_cached() {
            local label="$1"
            local url="$2"

            if [[ -s "$CACHE/$label.download" ]]; then
              echo "Using cached $label file (no download)."
              ln -f "$CACHE/$label.download" "$WORK/$label.download" \
                || cp "$CACHE/$label.download" "$WORK/$label.download"
            else
              download_file "$url" "$WORK/$label.download"
              ln -f "$WORK/$label.download" "$CACHE/$label.download" \
                || cp "$WORK/$label.download" "$CACHE/$label.download"
            fi
          }

          # Keys are small, so they are always downloaded fresh and never cached.
          download_file "$KEYS_URL" "$WORK/prod.keys"

          fetch_cached game "$GAME_URL"

          if [[ -n "${UPDATE_URL:-}" ]]; then
            fetch_cached update "$UPDATE_URL"
          else
            echo "No UPDATE_URL configured; continuing without an update."
          fi

          if [[ -n "${DLC_URL:-}" ]]; then
            fetch_cached dlc "$DLC_URL"
          else
            echo "No DLC_URL configured; continuing without DLC."
          fi

          chmod 600 "$WORK/prod.keys"

      - name: Save game files to cache
        if: steps.game_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/game-cache
          key: game-files-v1

      - name: Extract RAR archives or accept direct game packages
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"

          python - "$WORK" "$GAME_DIR" <<'PY'
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          package_extensions = {
              ".nsp", ".xci", ".nsz", ".xcz"
          }
          rar_signatures = (
              b"Rar!\x1a\x07\x00",
              b"Rar!\x1a\x07\x01\x00",
          )

          def validate_package(path):
              with path.open("rb") as f:
                  magic = f.read(4)

              suffix = path.suffix.lower()

              if suffix in (".nsp", ".nsz") and magic != b"PFS0":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

              if suffix in (".xci", ".xcz") and magic != b"HEAD":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

          def add_package(source, label):
              target = game_dir / source.name

              if target.exists():
                  raise SystemExit(
                      "Duplicate package filename: " + source.name
                  )

              validate_package(source)
              shutil.copy2(source, target)

              print(
                  f"Added {label}: {target.name} "
                  f"({target.stat().st_size:,} bytes)"
              )

          def process_download(label):
              source = work / f"{label}.download"

              if not source.exists():
                  print(f"No {label} download; skipping.")
                  return

              with source.open("rb") as f:
                  signature = f.read(8)

              is_rar = any(
                  signature.startswith(magic)
                  for magic in rar_signatures
              )

              if is_rar:
                  extract_dir = work / f"extracted-{label}"
                  extract_dir.mkdir(parents=True, exist_ok=True)

                  print(f"{label}: RAR archive detected; extracting.")

                  subprocess.run(
                      [
                          "unar",
                          "-o",
                          str(extract_dir),
                          str(source),
                      ],
                      check=True,
                  )

                  packages = sorted(
                      p for p in extract_dir.rglob("*")
                      if p.is_file()
                      and p.suffix.lower() in package_extensions
                  )

                  if not packages:
                      raise SystemExit(
                          f"No NSP/XCI/NSZ/XCZ packages found "
                          f"in the {label} RAR archive."
                      )

                  for package in packages:
                      add_package(package, label)

              else:
                  print(
                      f"{label}: not a RAR archive; "
                      "checking as a direct package."
                  )

                  if signature[:4] == b"PFS0":
                      extension = ".nsp"
                  elif signature[:4] == b"HEAD":
                      extension = ".xci"
                  else:
                      raise SystemExit(
                          f"{label} is not a recognized RAR archive "
                          "or direct NSP/XCI package. "
                          "Direct downloads must be NSP or XCI files."
                      )

                  target = game_dir / f"{label}{extension}"

                  if target.exists():
                      raise SystemExit(
                          f"Output package already exists: {target.name}"
                      )

                  shutil.copy2(source, target)
                  validate_package(target)

                  print(
                      f"Added direct package: {target.name} "
                      f"({target.stat().st_size:,} bytes)"
                  )

          process_download("game")
          process_download("update")
          process_download("dlc")

          packages = sorted(
              p for p in game_dir.iterdir()
              if p.is_file()
              and p.suffix.lower() in package_extensions
          )

          if not packages:
              raise SystemExit("No game packages were prepared.")

          print("\n=== Prepared game packages ===")
          for package in packages:
              print(f"{package.name}: {package.stat().st_size:,} bytes")
          PY

          test -s "$WORK/prod.keys"

      - name: Free disk space used by raw downloads
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"

          # The packages were copied into GameFiles; the raw downloads and the
          # cache folder (already saved above) are no longer needed this run.
          rm -f "$WORK"/*.download
          rm -rf "$WORK"/extracted-*
          rm -rf "$RUNNER_TEMP/game-cache"
          df -h /

      - name: Detect game title ID and select shader profile
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}

          def pfs0_names(path):
              try:
                  with path.open("rb") as f:
                      header = f.read(16)

                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []

                      count, string_size = struct.unpack_from(
                          "<II", header, 4
                      )

                      if count > 100000 or string_size > 100000000:
                          return []

                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)

                      if len(entries) != count * 0x18:
                          return []

                      names = []

                      for i in range(count):
                          offset = struct.unpack_from(
                              "<I", entries, i * 0x18 + 0x10
                          )[0]

                          if offset >= len(strings):
                              continue

                          end = strings.find(b"\0", offset)

                          if end < 0:
                              continue

                          names.append(
                              strings[offset:end].decode(
                                  errors="replace"
                              )
                          )

                      return names

              except (OSError, struct.error):
                  return []

          candidates = set()

          for path in root.iterdir():
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue

              for name in pfs0_names(path):
                  match = re.fullmatch(
                      r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik",
                      name,
                  )

                  if match:
                      title_id = int(match.group(1), 16)

                      if (title_id & 0xFFF) == 0:
                          candidates.add(f"{title_id:016X}")

              match = re.search(
                  r"\[([0-9A-Fa-f]{16})\]",
                  path.name,
              )

              if match:
                  title_id = int(match.group(1), 16)

                  if (title_id & 0xFFF) == 0:
                      candidates.add(f"{title_id:016X}")

          if len(candidates) != 1:
              raise SystemExit(
                  "Could not uniquely identify the base game's title ID. "
                  f"Candidates found: {sorted(candidates)}. "
                  "Check the base NSP and its ticket/filename."
              )

          print(next(iter(candidates)))
          PY
          )"

          PROFILE_ID="${PROFILE_OVERRIDE:-$DETECTED_ID}"
          PROFILE_ID="$(echo "$PROFILE_ID" | tr '[:lower:]' '[:upper:]')"

          if [[ ! "$PROFILE_ID" =~ ^[0-9A-F]{16}$ ]]; then
            echo "::error::Profile ID must be exactly 16 hexadecimal characters."
            exit 1
          fi

          echo "Detected base title ID: $DETECTED_ID"
          echo "Shader profile ID: $PROFILE_ID"
          echo "DM_GAME=$PROFILE_ID" >> "$GITHUB_ENV"
          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"

      - name: Update shader toolchain lock and header
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing shader toolchain for profile $DM_GAME"

          CHAIN_SCRIPT="$(
            find . -name dmsh_chain.py -type f -print -quit
          )"

          if [[ -z "$CHAIN_SCRIPT" ]]; then
            echo "::error::Could not find dmsh_chain.py"
            exit 1
          fi

          echo "Using: $CHAIN_SCRIPT"

          # This fork's dmsh_chain.py has no --update-lock (the lock file is
          # tool_lock.py's job); only --header exists.
          python "$CHAIN_SCRIPT" --header

      - name: Select Metal-compatible Xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app || true

          EXACT=0
          if [[ -d /Applications/Xcode_27.2.app ]]; then
            TARGET="/Applications/Xcode_27.2.app"
            EXACT=1
          else
            TARGET="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [[ -z "$TARGET" ]]; then
            echo "::error::No Xcode 27 on this runner. This project needs the Xcode 27 SDK (newer MetalFX APIs)."
            exit 1
          fi

          echo "Using $TARGET"
          sudo xcode-select -s "$TARGET/Contents/Developer"
          xcodebuild -downloadComponent MetalToolchain \
            || echo "::warning::Metal toolchain download failed"

          if [[ "$EXACT" == "1" ]]; then
            echo "METAL_FLAG=" >> "$GITHUB_ENV"
          else
            echo "::warning::Not Xcode 27.2; building with --allow-other-metal (untested compiler)."
            echo "METAL_FLAG=--allow-other-metal" >> "$GITHUB_ENV"
          fi

          xcodebuild -version
          xcrun -sdk iphoneos metal --version || true

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"

          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            -k "$WORK/prod.keys" \
            -o "$OUTPUT" \
            ${METAL_FLAG:-}

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-IPA-${{ inputs.device == 'iPhone 15 or older (BC fallback)' && 'BC-Fallback' || 'Standard' }}
          path: ${{ runner.temp }}/NxNative.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Logs
          path: |
            ${{ runner.temp }}/GameFiles/*_build/logs/
            ${{ runner.temp }}/GameFiles/*_survey/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles" \
            "$RUNNER_TEMP/game-cache"
