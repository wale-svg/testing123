name: find-motion
on: [push, workflow_dispatch]

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wale-svg/nxnative-wale
          ref: no-bc
          path: nx

      - name: Motion mapping
        run: |
          cd nx
          echo "=== dm_motion.h ==="
          cat dm/host/dm_motion.h
          echo "=== host motion_set_to / motion_fill ==="
          L=$(grep -n "^static void motion_set_to(live_motion" dm/host/hle_hid.c | tail -n1 | cut -d: -f1)
          sed -n "${L},$((L+40))p" dm/host/hle_hid.c
          L=$(grep -n "motion_fill(motion_state" dm/host/*.c dm/host/*.h | head -n1)
          echo "$L"
          grep -rn "motion_fill" dm/host/*.h | head -5
