name: find-motion
on: [push, workflow_dispatch]

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wale-svg/nxnative-wale
          ref: no-bc
          path: nx

      - name: Six-axis state code
        run: |
          cd nx
          echo "=== motion_fusion.h ==="
          cat dm/host/motion_fusion.h
          echo "=== six-axis state in hle_hid.c ==="
          grep -n -E "GetSixAxisSensorState|six_source|six_fill|SixAxisSensorState|delta_time|deltaTime|six_delay|SIX_DELAY" dm/host/hle_hid.c | head -60
          echo "=== six-axis notes in the docs ==="
          grep -n -i -E "six-axis|six_axis|SixAxis" docs/reference/services.md | cut -c1-260 | head -40
