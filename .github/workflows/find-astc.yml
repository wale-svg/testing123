name: find-astc
on: [push, workflow_dispatch]

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wale-svg/nxnative-wale
          ref: no-bc
          path: nx

      - name: Where BC and ASTC are handled
        run: |
          cd nx
          echo "=== files mentioning BC and ASTC ==="
          grep -rIl -E "ASTC|astc" dm docs README.md 2>/dev/null | head -30
          echo "=== no-bc / ASTC section of the README ==="
          grep -n -i -B2 -A12 -E "no-bc|astc" README.md | head -60
          echo "=== BC format handling in the graphics code ==="
          grep -rIn -E "BC[1-7]|ASTC" dm/gfx --include=*.m --include=*.c --include=*.h --include=*.py | head -80
          echo "=== docs on texture formats ==="
          grep -n -i -E "BC4|BC5|BC6|BC7|ASTC|unsupported format" docs/reference/*.md | head -40
