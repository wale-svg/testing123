name: symbolize-crash
on: [push, workflow_dispatch]

permissions:
  contents: read
  actions: read

jobs:
  sym:
    runs-on: ubuntu-latest
    steps:
      - name: Get the fork (for its tools)
        uses: actions/checkout@v4
        with:
          repository: wale-svg/nxnative-wale
          ref: no-bc
          path: nx

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install capstone lz4 zstandard

      - name: Get the build's logs and survey
        uses: actions/download-artifact@v4
        with:
          name: NxNative-Build-Logs
          run-id: 44481608542
          github-token: ${{ github.token }}
          path: logs

      - name: How sdis.py works
        run: |
          sed -n 1,45p nx/dm/tools/sdis.py
          ls nx/dm/tools
          grep -rIn -i -E "lz4|decompress" nx/dm/tools nx/scripts | head -15

      - name: Unpack sdk and look up the crash
        continue-on-error: true
        run: |
          python - <<'PY'
          import struct, lz4.block, glob
          src = glob.glob("logs/**/extract/ExeFS/sdk", recursive=True)[0]
          d = open(src, "rb").read()
          flags = struct.unpack_from("<I", d, 0xC)[0]
          segs = []
          for i in range(3):
              fo, mo, sz = struct.unpack_from("<III", d, 0x10 + 0x10 * i)
              cs = struct.unpack_from("<I", d, 0x60 + 4 * i)[0]
              raw = d[fo:fo + cs]
              if flags & (1 << i):
                  raw = lz4.block.decompress(raw, uncompressed_size=sz)
              segs.append((mo, raw))
          bss = struct.unpack_from("<I", d, 0x3C)[0]
          end = segs[2][0] + len(segs[2][1]) + bss
          img = bytearray(end)
          for mo, raw in segs:
              img[mo:mo + len(raw)] = raw
          open("sdk.flat", "wb").write(img)
          print("flat image bytes:", len(img))
          PY
          for a in 0x14f778 0x14f75c 0x898b4; do
            echo "=== sdk+$a ==="
            python nx/dm/tools/sdis.py sdk.flat --sym $a 2>&1 | head -30
          done
